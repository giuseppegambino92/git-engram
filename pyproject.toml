[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "git-engram"
version = "0.1.0"
description = "Local-first Spatio-Temporal, Causal & Negative RAG memory engine for AI coding agents (MCP server + CLI)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Giuseppe Gambino" }]
keywords = ["rag", "mcp", "git", "code-search", "ai-agents", "claude-code", "cursor", "embeddings", "quantization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "rich>=13.7",
    "mcp>=1.10",
]

[project.optional-dependencies]
treesitter = ["tree-sitter>=0.23", "tree-sitter-language-pack>=0.7"]
onnx = ["onnxruntime>=1.18", "tokenizers>=0.19"]
tui = ["textual>=0.80"]
dev = ["pytest>=8", "tree-sitter>=0.23", "tree-sitter-language-pack>=0.7", "textual>=0.80", "ruff>=0.6"]

[project.scripts]
git-engram = "git_engram.cli.main:main"

[project.urls]
Homepage = "https://github.com/giuseppegambino92/git-engram"
Repository = "https://github.com/giuseppegambino92/git-engram"
Issues = "https://github.com/giuseppegambino92/git-engram/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/git_engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"src/git_engram/evals/fixture.py" = ["E501"]  # verbatim tool output inside fixture data
